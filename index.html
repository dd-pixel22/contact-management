<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard | ContactHub</title><link rel="stylesheet" href="style.css"></head>
<body data-page="index" data-title="Dashboard" data-sub="Live overview of your contacts and calls.">
<main class="content">
<section class="stats">
 <div class="panel stat"><span>Total Contacts</span><b id="s-total">0</b><i></i></div>
 <div class="panel stat"><span>Available Now</span><b id="s-av">0</b><i></i></div>
 <div class="panel stat"><span>On Call</span><b id="s-on">0</b><i></i></div>
 <div class="panel stat"><span>Calls Today</span><b id="s-calls">0</b><i></i></div>
 <div class="panel stat"><span>Avg Handle Time</span><b id="s-aht">--:--</b><i></i></div>
</section>
<section class="grid2">
 <div class="panel"><div class="row between"><h3>Live Contact Map</h3><a class="btn ghost" href="map.html">Open full map</a></div><div class="map"><svg id="map"></svg></div></div>
 <div class="col">
  <div class="panel"><h3>Agent Status</h3><div class="ringwrap"><div class="ring" id="ring"><div><b id="ring-v">0%</b><small>available</small></div></div></div><div class="legend" id="legend"></div></div>
  <div class="panel"><h3>Quick Dial</h3><ul class="ul" id="dial"></ul></div>
 </div>
</section>
<section class="grid2 eq">
 <div class="panel"><h3>Recent Calls</h3><ul class="feed" id="feed"></ul></div>
 <div class="panel"><h3>Departments</h3><div class="bars" id="depts"></div></div>
</section>
</main>
<script src="app.js"></script></body></html>
